<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muto Menu — In-Game Mod Toggling for Fabric</title>
    <meta
      name="description"
      content="Native ModMenu integration for toggling, enabling, disabling, and hot-swapping Fabric 26.x mods inside Minecraft without restarting."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..500;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#134CFF" />
    <meta property="og:title" content="Muto Menu — Live Mod Management in ModMenu" />
    <meta
      property="og:description"
      content="Disable, enable, and hot-swap Fabric mods directly from Minecraft's Mods screen powered by Muto Runtime."
    />
    <meta property="og:image" content="https://mutomenu.fy2ne.me/screenshot-modmenu.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mutomenu.fy2ne.me" />
    <script>
      (function () {
        var t = "dark";
        try {
          t = localStorage.getItem("mutomenu-theme") || "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.classList.toggle("dark", t === "dark");
        document.documentElement.classList.toggle("light", t !== "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
